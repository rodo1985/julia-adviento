<style>
:root{--g1:#6f7780;--g2:#a3aab2;--gold:#f0c53a;--gold2:#d49e1c;--ink:#3b2a10}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;position:fixed;inset:0;width:100%}
body{font-family:"Comic Sans MS","Chalkboard SE","Comic Neue","Trebuchet MS",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;color:var(--ink);
 background:linear-gradient(#5f666e 0%,#8c939b 35%,#b4bac0 55%,#f3d061 55%,#e3ae22 100%)}
#sky{position:fixed;inset:0;pointer-events:none}
#sky svg{position:absolute;width:100%;height:100%}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 12px 4px}
header .logo{width:clamp(38px,11vw,64px);flex:0 0 auto;animation:bob 1.2s ease-in-out infinite;transform-origin:50% 100%}
header .logo svg{width:100%;height:auto;display:block}
h1{margin:0;flex:1 1 auto;font-size:clamp(17px,5.4vw,36px);line-height:1.05;color:#fff;text-shadow:0 2px 0 #4b525a,0 0 8px rgba(0,0,0,.25)}
h1 small{display:block;font-size:.62em;color:#ffe27a}
#reset{flex:0 0 auto;border:2px solid #fff;background:rgba(255,255,255,.25);color:#fff;font:inherit;font-size:clamp(12px,3.2vw,16px);padding:6px 10px;border-radius:999px;cursor:pointer;min-height:36px}
#reset.sure{background:#d23a4a;border-color:#ffd1d6}
#grid{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(6,1fr);gap:clamp(6px,1.8vmin,14px);padding:6px clamp(8px,3vw,24px) clamp(10px,2vmin,20px)}
@media (min-aspect-ratio:3/4){#grid{grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(4,1fr)}}
@media (min-aspect-ratio:17/10){#grid{grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(3,1fr)} header{padding-top:4px;padding-bottom:0}}
.door{position:relative;border:0;padding:0;margin:0;background:#4a3206;border-radius:14px;perspective:700px;cursor:pointer;font:inherit;box-shadow:0 4px 0 rgba(0,0,0,.25),inset 0 0 0 3px #8a6412;min-width:0;min-height:0}
.door .inside{position:absolute;inset:4px;border-radius:10px;background:radial-gradient(circle at 50% 40%,#fff3c4,#f0c53a 60%,#b9860f);display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.door .inside svg{height:86%;width:auto;max-width:90%}
.door .inside b{position:absolute;top:3px;left:6px;font-size:clamp(12px,3.4vmin,20px);color:#7a5408}
.door .front{position:absolute;inset:0;border-radius:14px;background:linear-gradient(#b5bbc2 0%,#959ca4 49.5%,#f5d25a 50.5%,#e0aa20 100%);border:3px solid rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;transform-origin:0 50%;transition:transform .8s cubic-bezier(.3,1.4,.5,1);backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:inset 0 0 0 2px rgba(0,0,0,.08)}
.door .front::before{content:"\2605";position:absolute;top:6%;left:50%;transform:translateX(-50%);color:#fff;font-size:clamp(10px,2.6vmin,18px);opacity:.9}
.door .front::after{content:"";position:absolute;right:10%;top:68%;width:clamp(6px,1.6vmin,11px);height:clamp(6px,1.6vmin,11px);border-radius:50%;background:#8a6412;box-shadow:inset -1px -1px 0 #5c4208}
.door .num{font-size:clamp(22px,6.8vmin,54px);font-weight:900;color:#4a3206;background:#fff;border-radius:999px;min-width:1.6em;height:1.6em;line-height:1.6em;text-align:center;box-shadow:0 3px 0 rgba(0,0,0,.2);padding:0 .15em}
.door.open .front{transform:rotateY(-108deg)}
.door.today .front{animation:wiggle 2s ease-in-out infinite}
.door:active .num{transform:scale(.92)}
/* scene */
#scene{position:fixed;inset:0;background:rgba(40,44,52,.65);display:none;align-items:center;justify-content:center;z-index:20;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#scene.show{display:flex}
.card{width:min(94vw,640px);max-height:96%;background:linear-gradient(#e4e7ea 0%,#e4e7ea 45%,#fff3cf 45%,#fde7a0 100%);border-radius:24px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.4);border:4px solid #fff;animation:pop .5s cubic-bezier(.3,1.5,.5,1)}
.stage{position:relative;width:100%;aspect-ratio:1/1;max-height:62vh;overflow:hidden;flex:0 0 auto;background:#9aa1a8}
.panel{padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px;min-height:0}
.day{align-self:flex-start;background:#f0c53a;color:#4a3206;font-weight:900;border-radius:999px;padding:2px 14px;font-size:clamp(16px,4.5vw,22px);border:2px solid #fff}
.txt{margin:0;font-size:clamp(20px,5.6vw,30px);line-height:1.25;font-weight:700}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns button{flex:1 1 120px;border:0;border-radius:18px;font:inherit;font-weight:900;font-size:clamp(17px,4.6vw,22px);padding:12px 10px;min-height:54px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25)}
#speak{background:#8f97a0;color:#fff}
#close{background:#e0aa20;color:#4a3206}
@media (orientation:landscape){
 .card{flex-direction:row;width:auto;max-width:96vw;height:min(92vh,620px);max-height:none}
 .stage{height:100%;width:auto;max-height:none;aspect-ratio:4/3}
 .panel{width:min(34vw,300px);justify-content:center}
 .card{background:linear-gradient(#e4e7ea 0%,#e4e7ea 50%,#fff3cf 50%,#fde7a0 100%)}
 .txt{font-size:clamp(17px,3.2vw,28px)}
 .btns{flex-direction:column}
 .btns button{flex:0 0 auto;min-height:48px;font-size:clamp(16px,2.6vw,22px)}
}
.bg{position:absolute;inset:0;width:100%;height:100%}
.row{position:absolute;left:3%;right:3%;bottom:7%;top:8%;display:flex;justify-content:space-evenly;align-items:flex-end}
.ch{position:relative;display:flex;flex-direction:column;align-items:center;transform-origin:50% 100%}
.ch svg{width:100%;height:auto;display:block;overflow:visible}
.ch .nm{font-size:clamp(9px,2.6vmin,14px);font-weight:900;background:rgba(255,255,255,.85);border-radius:8px;padding:0 5px;margin-top:-2px;white-space:nowrap}
.boat{position:relative;display:flex;justify-content:center;align-items:flex-end;animation:rock 2.4s ease-in-out infinite;transform-origin:50% 90%}
.boat .mast{position:absolute;left:0;width:100%;bottom:12%;height:auto;z-index:0}
.boat .crew{position:relative;z-index:1;display:flex;justify-content:space-evenly;width:86%;align-items:flex-end;padding-bottom:12%}
.boat .hull{position:absolute;left:0;bottom:0;width:100%;height:auto;z-index:2}
.prop{position:relative}
.prop svg{width:100%;height:auto;display:block}
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.note{position:absolute;font-size:clamp(18px,5vmin,34px);color:#fff;text-shadow:0 2px 0 #6b4a0a;animation:floatup 3s linear infinite;opacity:0}
.spark{position:absolute;color:#fff6b0;font-size:clamp(14px,4vmin,28px);animation:twinkle 1.4s ease-in-out infinite;text-shadow:0 0 8px #ffd23f}
.conf{position:absolute;top:-5%;width:2.2%;height:3.5%;border-radius:2px;animation:fall 3.2s linear infinite}
.puff{position:absolute;width:20%;animation:puff 2.2s ease-out infinite}
.nonote{position:absolute;left:4%;top:4%;width:16%}
.bubble{position:absolute;bottom:92%;left:55%;width:80%;animation:bob 1.6s ease-in-out infinite}
.q{position:absolute;bottom:96%;left:50%;transform:translateX(-50%);font-size:clamp(24px,7vmin,48px);font-weight:900;color:#fff;text-shadow:0 2px 0 #5a3d0a;animation:qq 1.2s ease-in-out infinite}
.say{position:absolute;bottom:100%;left:10%;background:#fff;border-radius:14px;padding:4px 8px;font-weight:900;font-size:clamp(12px,3.4vmin,20px);white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.2);animation:bob 1.4s ease-in-out infinite}
.peek{position:absolute;right:-3%;bottom:30%;width:16%;animation:peek 3.5s ease-in-out infinite}
.lights{position:absolute;inset:0;background:radial-gradient(circle at 20% 10%,rgba(255,90,160,.45),transparent 35%),radial-gradient(circle at 80% 15%,rgba(80,200,255,.45),transparent 35%),radial-gradient(circle at 50% 0%,rgba(255,230,90,.5),transparent 40%);animation:lights 1.6s ease-in-out infinite alternate}
/* character animations */
.a-bob{animation:bob .9s ease-in-out infinite}
.a-sway{animation:sway 1.3s ease-in-out infinite}
.a-dance{animation:dance 1.1s ease-in-out infinite}
.a-spin{animation:spin 2.2s ease-in-out infinite}
.a-jump{animation:jump .8s cubic-bezier(.3,0,.6,1) infinite}
.a-shake{animation:shake 1.6s ease-in-out infinite}
.a-vanish{animation:vanish 2.6s ease-in-out infinite}
.a-cast{animation:cast 1.2s ease-in-out infinite}
.a-float{animation:float 2.4s ease-in-out infinite}
.a-flyaway{animation:flyaway 3.4s ease-in infinite}
.a-walk{animation:walk 3s ease-in-out infinite}
.a-stomp{animation:stomp .6s ease-in-out infinite}
.a-sneak{animation:sneak 2.4s ease-in-out infinite}
.arm{animation:wave .7s ease-in-out infinite alternate}
.arm.r{animation-delay:-.35s}
.ch.a-vanish .arm,.ch.a-shake .arm{animation-duration:1.4s}
.ponytail{animation:wave .5s ease-in-out infinite alternate}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7%)}}
@keyframes sway{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
@keyframes dance{0%{transform:translateY(0) rotate(-8deg)}25%{transform:translateY(-8%) rotate(0)}50%{transform:translateY(0) rotate(8deg)}75%{transform:translateY(-8%) rotate(0)}100%{transform:translateY(0) rotate(-8deg)}}
@keyframes spin{0%{transform:rotateY(0)}60%,100%{transform:rotateY(360deg)}}
@keyframes jump{0%,100%{transform:translateY(0) scale(1.05,.95)}40%{transform:translateY(-20%) scale(.96,1.05)}70%{transform:translateY(-4%)}}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-5deg)}40%{transform:rotate(5deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(0)}}
@keyframes vanish{0%,15%{opacity:1;transform:scale(1)}55%,75%{opacity:.12;transform:scale(.7) rotate(20deg)}100%{opacity:1;transform:scale(1)}}
@keyframes cast{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(6deg) translateY(-4%)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10%) rotate(3deg)}}
@keyframes flyaway{0%{transform:translate(0,0);opacity:1}70%{transform:translate(160%,-60%) rotate(25deg);opacity:1}71%,85%{opacity:0;transform:translate(0,0)}100%{opacity:1}}
@keyframes walk{0%,100%{transform:translateX(-30%) rotate(-4deg)}50%{transform:translateX(30%) rotate(4deg)}}
@keyframes stomp{0%,100%{transform:translateY(0)}50%{transform:translateY(-4%) scale(1.04)}}
@keyframes sneak{0%,100%{transform:translateX(0)}50%{transform:translateX(-12%)}}
@keyframes wave{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
@keyframes rock{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(3deg) translateY(-2%)}}
@keyframes floatup{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-260%) rotate(20deg);opacity:0}}
@keyframes twinkle{0%,100%{transform:scale(.6);opacity:.4}50%{transform:scale(1.2);opacity:1}}
@keyframes fall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(3200%) rotate(540deg)}}
@keyframes puff{0%{transform:scale(.3);opacity:0}30%{opacity:.95}100%{transform:scale(1.3) translateY(-20%);opacity:0}}
@keyframes qq{0%,100%{transform:translateX(-50%) rotate(-10deg)}50%{transform:translateX(-50%) rotate(10deg) scale(1.15)}}
@keyframes peek{0%,30%,100%{transform:translateX(70%)}45%,80%{transform:translateX(0)}}
@keyframes lights{from{opacity:.5}to{opacity:1}}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes wiggle{0%,90%,100%{transform:rotate(0)}93%{transform:rotate(-3deg)}96%{transform:rotate(3deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:3s!important}}
</style>
</head>

/* ---------- sound ---------- */
var AC=null;
function chime(){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); var t=AC.currentTime; [784,988,1319].forEach(function(f,i){ var o=AC.createOscillator(),g=AC.createGain(); o.type="triangle"; o.frequency.value=f; g.gain.setValueAtTime(0,t+i*.09); g.gain.linearRampToValueAtTime(.12,t+i*.09+.02); g.gain.exponentialRampToValueAtTime(.001,t+i*.09+.5); o.connect(g); g.connect(AC.destination); o.start(t+i*.09); o.stop(t+i*.09+.55); }); }catch(e){} }
/* ---------- build calendar ---------- */
var grid=document.getElementById("grid");
document.getElementById("logo").innerHTML=C.dracula();
var now=new Date(), todayN=(now.getMonth()===11&&now.getDate()<=24)?now.getDate():0;
for(var n=1;n<=24;n++){
  var b=document.createElement("button");
  b.type="button"; b.className="door"+(opened[n]?" open":"")+(n===todayN?" today":""); b.dataset.n=n;
  b.setAttribute("aria-label","Puerta "+n);
  b.innerHTML='<div class="inside"><b>'+n+'</b>'+C[mainChar(D[n-1])]()+'</div><div class="front"><span class="num">'+n+'</span></div>';
  grid.appendChild(b);
}
var timer=null;
grid.addEventListener("click",function(e){
  var b=e.target.closest(".door"); if(!b)return;
  var n=+b.dataset.n;
  if(opened[n]){ showScene(n); return; }
  opened[n]=1; save(); b.classList.add("open"); b.classList.remove("today"); chime();
  clearTimeout(timer); timer=setTimeout(function(){showScene(n);},750);
});
/* ---------- scene dialog ---------- */
var sceneEl=document.getElementById("scene"), stage=document.getElementById("stage"), txt=document.getElementById("txt"), dayEl=document.getElementById("day"), cur=0;
function showScene(n){ cur=n; var d=D[n-1]; stage.innerHTML=renderStage(d); txt.textContent=d.t; dayEl.textContent="Día "+n; sceneEl.classList.add("show"); var c=sceneEl.querySelector(".card"); c.style.animation="none"; void c.offsetWidth; c.style.animation=""; }
function hideScene(){ sceneEl.classList.remove("show"); stage.innerHTML=""; stopSpeak(); }
document.getElementById("close").addEventListener("click",hideScene);
sceneEl.addEventListener("click",function(e){ if(e.target===sceneEl)hideScene(); });
document.addEventListener("keydown",function(e){ if(e.key==="Escape")hideScene(); });
/* ---------- speech (es-ES) ---------- */
var speakBtn=document.getElementById("speak"), synth=window.speechSynthesis;
if(!synth||typeof SpeechSynthesisUtterance==="undefined"){ speakBtn.style.display="none"; }
function stopSpeak(){ try{ if(synth)synth.cancel(); }catch(e){} }
speakBtn.addEventListener("click",function(){
  if(!synth||!cur)return; stopSpeak();
  var u=new SpeechSynthesisUtterance(D[cur-1].t.replace(/[«»]/g,"")); u.lang="es-ES"; u.rate=.85; u.pitch=1.15;
  try{ var v=synth.getVoices().filter(function(v){return /^es[-_]ES/i.test(v.lang);})[0]||synth.getVoices().filter(function(v){return /^es/i.test(v.lang);})[0]; if(v)u.voice=v; }catch(e){}
  synth.speak(u);
});
/* ---------- reset ---------- */
var resetBtn=document.getElementById("reset"), resetT=null;
resetBtn.addEventListener("click",function(){
  if(!resetBtn.classList.contains("sure")){ resetBtn.classList.add("sure"); resetBtn.textContent="¿Seguro? Toca otra vez"; clearTimeout(resetT); resetT=setTimeout(function(){ resetBtn.classList.remove("sure"); resetBtn.textContent="Cerrar todas"; },3000); return; }
  clearTimeout(resetT); opened={}; save();
  [].forEach.call(document.querySelectorAll(".door.open"),function(d){d.classList.remove("open");});
  resetBtn.classList.remove("sure"); resetBtn.textContent="Cerrar todas";
});
/* prevent pinch / double-tap zoom & rubber-band scroll */
document.addEventListener("touchmove",function(e){ if(e.touches.length>1||!e.target.closest(".panel"))e.preventDefault(); },{passive:false});
document.addEventListener("gesturestart",function(e){e.preventDefault();});
window.__adviento={D:D,open:showScene};
})();
</script>
</body>
</html>
